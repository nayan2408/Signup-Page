<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Hub</title>
    <style>
        /* Modern Flat Typography & Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            letter-spacing: -0.01em;
        }

        body {
            background-color: #0f172a; /* Color 1: Matte Slate */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        /* Sleek Modern Block Container */
        .auth-card {
            background-color: #ffffff; /* Color 2: Crisp White */
            width: 100%;
            max-width: 400px;
            padding: 40px 32px;
            border: 1px solid #e2e8f0; /* Color 4: Soft Gray */
        }

        .brand-header {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
            text-align: left;
        }

        .brand-subtext {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 32px;
        }

        /* Modern Segmented Control Tab Switcher */
        .tab-navigation {
            display: flex;
            background-color: #f1f5f9;
            padding: 4px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }

        .tab-toggle {
            flex: 1;
            padding: 10px 0;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }

        .tab-toggle.active {
            background-color: #ffffff;
            color: #2563eb; /* Color 3: Electric Blue */
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        /* Presentation panels */
        .form-panel {
            display: none;
        }

        .form-panel.visible {
            display: block;
        }

        /* Sharp Minimal Input Blocks */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #0f172a;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
            font-size: 15px;
            color: #0f172a;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        /* Full Premium Flat Action Buttons */
        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.1s ease;
        }

        .submit-btn:hover {
            background-color: #1d4ed8;
        }

        /* Status Alert Window */
        .notification-banner {
            margin-bottom: 20px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            display: none;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            color: #0f172a;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand-header">Welcome back</div>
        <div class="brand-subtext">Enter your details to manage your account.</div>

        <!-- Navigation System -->
        <div class="tab-navigation">
            <button class="tab-toggle active" id="loginTabBtn" onclick="changePanel('login')">Log In</button>
            <button class="tab-toggle" id="signupTabBtn" onclick="changePanel('signup')">Sign Up</button>
        </div>

        <div id="noticeBox" class="notification-banner"></div>

        <!-- Login Panel -->
        <form id="loginFormPanel" class="form-panel visible" onsubmit="triggerDemo(event, 'login')">
            <div class="form-group">
                <label for="userEmail">Email address</label>
                <input type="email" id="userEmail" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="userPassword">Password</label>
                <input type="password" id="userPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="submit-btn">Continue</button>
        </form>

        <!-- Sign Up Panel -->
        <form id="signupFormPanel" class="form-panel" onsubmit="triggerDemo(event, 'signup')">
            <div class="form-group">
                <label for="newName">Username</label>
                <input type="text" id="newName" required placeholder="username">
            </div>
            <div class="form-group">
                <label for="newEmail">Email address</label>
                <input type="email" id="newEmail" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="newPassword">Password</label>
                <input type="password" id="newPassword" required minlength="6" placeholder="Minimum 6 characters">
            </div>
            <button type="submit" class="submit-btn">Create account</button>
        </form>
    </div>

    <script>
        function changePanel(targetPanel) {
            const loginForm = document.getElementById('loginFormPanel');
            const signupForm = document.getElementById('signupFormPanel');
            const loginBtn = document.getElementById('loginTabBtn');
            const signupBtn = document.getElementById('signupTabBtn');
            const notice = document.getElementById('noticeBox');

            notice.style.display = 'none';

            if (targetPanel === 'login') {
                loginForm.classList.add('visible');
                signupForm.classList.remove('visible');
                loginBtn.classList.add('active');
                signupBtn.classList.remove('active');
            } else {
                loginForm.classList.remove('visible');
                signupForm.classList.add('visible');
                loginBtn.classList.remove('active');
                signupBtn.classList.add('active');
            }
        }

        function triggerDemo(e, formMode) {
            e.preventDefault();
            const notice = document.getElementById('noticeBox');
            notice.style.display = 'block';
            
            if (formMode === 'login') {
                const mail = document.getElementById('userEmail').value;
                notice.innerText = `Authenticated session for: ${mail}`;
            } else {
                const user = document.getElementById('newName').value;
                notice.innerText = `Account initialized for: ${user}`;
            }
        }
    </script>
</body>
</html>
