<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flat Design Auth Portal</title>
    <style>
        /* Flat Design Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #2c3e50; /* Solid Flat Dark Slate */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container with Crisp Solid Border */
        .auth-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border: 4px solid #34495e;
        }

        .auth-title {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Flat Tab Menu */
        .tab-menu {
            display: flex;
            margin-bottom: 25px;
            border: 2px solid #bdc3c7;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background-color: #ecf0f1;
            border: none;
            font-size: 14px;
            font-weight: 700;
            color: #7f8c8d;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.1s;
        }

        .tab-btn.active {
            background-color: #3498db; /* Flat Blue */
            color: #ffffff;
        }

        /* Form Visibility */
        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
        }

        /* Input Block */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 700;
            color: #34495e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #bdc3c7;
            background-color: #fafafa;
            font-size: 14px;
            color: #2c3e50;
            outline: none;
        }

        .input-group input:focus {
            border-color: #3498db;
            background-color: #ffffff;
        }

        /* Action Buttons */
        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn {
            background-color: #2ecc71; /* Flat Emerald Green */
        }

        .login-btn:hover {
            background-color: #27ae60;
        }

        .signup-btn {
            background-color: #e67e22; /* Flat Carrot Orange */
        }

        .signup-btn:hover {
            background-color: #d35400;
        }

        /* Alert Box */
        .status-message {
            margin-bottom: 20px;
            padding: 10px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            display: none;
            border: 2px solid #2ecc71;
            background-color: #e8f8f5;
            color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2 class="auth-title">User Access</h2>

        <!-- Navigation Tabs -->
        <div class="tab-menu">
            <button type="button" class="tab-btn active" id="loginTab" onclick="switchMode('login')">Log In</button>
            <button type="button" class="tab-btn" id="signupTab" onclick="switchMode('signup')">Sign Up</button>
        </div>

        <!-- Notification Box -->
        <div id="statusMessage" class="status-message"></div>

        <!-- Login Form -->
        <form id="loginForm" class="form-panel active" onsubmit="handleSubmit(event, 'login')">
            <div class="input-group">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" placeholder="user@domain.com" required>
            </div>
            <div class="input-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-btn login-btn">Log In</button>
        </form>

        <!-- Sign Up Form -->
        <form id="signupForm" class="form-panel" onsubmit="handleSubmit(event, 'signup')">
            <div class="input-group">
                <label for="signupUsername">Username</label>
                <input type="text" id="signupUsername" placeholder="john_doe" required>
            </div>
            <div class="input-group">
                <label for="signupEmail">Email Address</label>
                <input type="email" id="signupEmail" placeholder="user@domain.com" required>
            </div>
            <div class="input-group">
                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" minlength="6" placeholder="Min 6 characters" required>
            </div>
            <button type="submit" class="submit-btn signup-btn">Create Account</button>
        </form>
    </div>

    <script>
        function switchMode(mode) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const statusMsg = document.getElementById('statusMessage');

            statusMsg.style.display = 'none';

            if (mode === 'login') {
                loginForm.classList.add('active');
                signupForm.classList.remove('active');
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
            } else {
                signupForm.classList.add('active');
                loginForm.classList.remove('active');
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
            }
        }

        function handleSubmit(event, type) {
            event.preventDefault();
            const statusMsg = document.getElementById('statusMessage');
            statusMsg.style.display = 'block';

            if (type === 'login') {
                const email = document.getElementById('loginEmail').value;
                statusMsg.innerText = `Logged in successfully as ${email}`;
            } else {
                const username = document.getElementById('signupUsername').value;
                statusMsg.innerText = `Account created for ${username}`;
            }
        }
    </script>

</body>
</html>
