<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashdark X - Complete Full Page Enterprise Platform</title>
    <style>
        /* Force screen containment - zero margins, no blank gaps, no double scrollbars */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background-color: #0b0f19;
            color: #ffffff;
            overflow: hidden; 
        }

        /* 3-Column Full Page Grid System spanning the absolute entire window */
        .full-page-grid {
            display: grid;
            grid-template-columns: 260px 1fr 400px;
            width: 100vw;
            height: 100vh;
        }

        /* Common tile system styling to mimic dashboard data components */
        .grid-tile {
            background-color: #131a2e;
            border: 1px solid #1e293b;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        /* COL 1: Structural Left Sidebar Panel */
        .sidebar-panel {
            grid-column: 1;
            border-right: 1px solid #1e293b;
            justify-content: flex-start;
            gap: 8px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 24px;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 16px;
        }

        .brand-dot {
            width: 14px;
            height: 14px;
            background-color: #c084fc;
            border-radius: 50%;
            box-shadow: 0 0 10px #c084fc;
        }

        .brand-txt {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .nav-item {
            padding: 12px 16px;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-item.active {
            background-color: rgba(192, 132, 252, 0.1);
            color: #c084fc;
            border-left: 4px solid #c084fc;
        }

        /* COL 2: Central Analytics Monitor Space */
        .analytics-space {
            grid-column: 2;
            display: grid;
            grid-template-rows: 80px 1fr 1fr;
            height: 100%;
            background-color: #0b0f19;
        }

        .top-navbar {
            grid-row: 1;
            background-color: #131a2e;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
        }

        .navbar-title {
            font-size: 20px;
            font-weight: 700;
        }

        /* Sub-grid filling the top section of analytics window space */
        .metrics-subgrid {
            grid-row: 2;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-bottom: 1px solid #1e293b;
        }

        .metric-card {
            border-right: 1px solid #1e293b;
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .metric-card:last-child {
            border-right: none;
        }

        .metric-label {
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .metric-val {
            font-size: 28px;
            font-weight: 700;
        }

        .metric-val.green { color: #2ecc71; }
        .metric-val.red { color: #e74c3c; }

        /* Chart Simulation Visualization box filling the bottom row space */
        .visualization-box {
            grid-row: 3;
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .mock-graph-container {
            flex: 1;
            border: 2px dashed #1e293b;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 16px;
        }

        .mock-bar {
            flex: 1;
            background-color: rgba(192, 132, 252, 0.2);
            border-top: 3px solid #c084fc;
            transition: height 0.5s;
        }

        /* COL 3: Structural Right Access & Authentication Panel */
        .auth-panel {
            grid-column: 3;
            border-left: 1px solid #1e293b;
            justify-content: center;
            align-items: center;
            padding: 48px;
        }

        .auth-wrapper {
            width: 100%;
        }

        .tab-menu {
            display: flex;
            background-color: #0b0f19;
            padding: 4px;
            margin-bottom: 32px;
            border: 1px solid #1e293b;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 0;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: #131a2e;
            color: #c084fc;
            border: 1px solid #1e293b;
        }

        .form-view {
            display: none;
        }

        .form-view.visible {
            display: block;
        }

        .input-block {
            margin-bottom: 24px;
        }

        .input-block label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
        }

        .input-block input {
            width: 100%;
            padding: 14px;
            border: 1px solid #1e293b;
            background-color: #0b0f19;
            font-size: 15px;
            color: #ffffff;
            outline: none;
        }

        .input-block input:focus {
            border-color: #c084fc;
        }

        .action-submit {
            width: 100%;
            padding: 14px;
            border: none;
            background-color: #d946ef;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        .action-submit:hover {
            background-color: #c026d3;
            box-shadow: 0 0 15px rgba(217, 70, 239, 0.4);
        }

        .sys-alert {
            margin-bottom: 24px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            display: none;
            background-color: rgba(192, 132, 252, 0.1);
            border: 1px solid #c084fc;
            color: #c084fc;
        }
    </style>
</head>

        <div class="analytics-space">

            <!-- Visualization System Grid Block -->
            <div class="grid-tile visualization-box">
                <div class="chart-header">
                    <div>
                        <div style="font-size: 14px; color: #64748b; font-weight: 600;">TOTAL REVENUE</div>

                <div class="mock-graph-container">
