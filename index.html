
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YourBrand | Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      color: #152849;
      background: #ffffff;
    }

    .welcome {
      width: 50%;
      min-height: 100vh;
      background: #eaf3ff;
      padding: 90px 8%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .welcome h1 {
      font-size: clamp(36px, 4vw, 52px);
      margin-bottom: 20px;
    }

    .welcome p {
      color: #647795;
      font-size: 19px;
      line-height: 1.7;
      max-width: 380px;
    }

    .illustration {
      font-size: 110px;
      text-align: center;
      margin-top: 55px;
      padding: 30px;
      background: #d5e6ff;
      border-radius: 18px;
    }

    .login-section {
      width: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 24px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      color: #3478f6;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 42px;
    }

    h2 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #647795;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #405778;
      font-weight: 600;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 16px;
      border: 1px solid #dbe3ef;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #3478f6;
      box-shadow: 0 0 0 3px #3478f620;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 27px;
      font-size: 14px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: normal;
      margin: 0;
    }

    a {
      color: #3478f6;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 8px;
      background: #3478f6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #2463dc;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 30px 0;
      color: #8190a8;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #dbe3ef;
      flex: 1;
    }

    .signup {
      text-align: center;
      color: #647795;
    }

    #message {
      margin-top: 15px;
      color: #2463dc;
      line-height: 1.5;
      font-size: 14px;
    }

    @media (max-width: 760px) {
      body {
        display: block;
      }

      .welcome {
        display: none;
      }

      .login-section {
        width: 100%;
        min-height: 100vh;
        padding: 32px 22px;
      }

      .login-box {
        max-width: 430px;
      }

      .brand {
        margin-bottom: 45px;
      }

      h2 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>
  <section class="welcome">
    <h1>Welcome Back!</h1>
    <p>Log in to continue your journey and reach your goals.</p>
    <div class="illustration" aria-hidden="true">💻</div>
  </section>

  <section class="login-section">
    <div class="login-box">
      <div class="brand">✦ YourBrand</div>

      <h2 id="heading">Login</h2>
      <p class="subtitle" id="subtitle">
        Enter your email and password to access your account.
      </p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            minlength="6"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="options">
          <label class="remember">
            <input type="checkbox" id="remember">
            Remember me
          </label>
          <a href="#" id="forgot">Forgot password?</a>
        </div>

        <button type="submit" id="submitBtn">Log In</button>
        <p id="message" role="status"></p>
      </form>

      <div class="divider">OR</div>

      <p class="signup">
        <span id="signupText">Don't have an account?</span>
        <a href="#" id="signupLink">Sign up</a>
      </p>
    </div>
  </section>

  <script>
    const form = document.getElementById("loginForm");
    const heading = document.getElementById("heading");
    const subtitle = document.getElementById("subtitle");
    const submitBtn = document.getElementById("submitBtn");
    const signupText = document.getElementById("signupText");
    const signupLink = document.getElementById("signupLink");
    const message = document.getElementById("message");
    const password = document.getElementById("password");

    let signupMode = false;

    // Toggle password visibility by double-clicking the field.
    password.addEventListener("dblclick", () => {
      password.type =
        password.type === "password" ? "text" : "password";
    });

    // Switch between login and signup screens.
    signupLink.addEventListener("click", (event) => {
      event.preventDefault();
      signupMode = !signupMode;

      heading.textContent = signupMode ? "Create Account" : "Login";
      submitBtn.textContent = signupMode ? "Sign Up" : "Log In";
      signupText.textContent = signupMode
        ? "Already have an account?"
        : "Don't have an account?";
      signupLink.textContent = signupMode ? "Log in" : "Sign up";
      subtitle.textContent = signupMode
        ? "Create an account to get started."
        : "Enter your email and password to access your account.";

      password.autocomplete = signupMode
        ? "new-password"
        : "current-password";

      message.textContent = "";
    });

    // Demo-only password recovery interaction.
    document.getElementById("forgot").addEventListener("click", (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();

      message.textContent = email
        ? "Connect a password-reset service to send a real reset email."
        : "Please enter your email address first.";
    });

    // Validate the form. A backend is needed for real authentication.
    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (!form.reportValidity()) return;

      const email = document.getElementById("email").value.trim();

      message.textContent =
        `${signupMode ? "Sign-up" : "Login"} form validated for ${email}. ` +
        "Connect a secure authentication service to continue.";
    });
  </script>
</body>
</html>
