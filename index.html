<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Portal - Right Panel Only</title>
    <style>
        /* Modern Flat Design Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: #f4f6fc; /* Color 1: Light Soft Gray */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Right Side Form Canvas Only */
        .form-canvas {
            width: 100%;
            max-width: 440px;
            background-color: #ffffff; /* Color 2: Crisp White */
            padding: 50px 40px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header-title {
            font-size: 22px;
            font-weight: 800;
            color: #1e293b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
            text-align: center;
        }

        /* Sub-Segmented Navigation Control Tabs */
        .control-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 28px;
            justify-content: center;
        }

        .tab-trigger {
            padding: 6px 16px;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            font-size: 13px;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
        }

        .tab-trigger.active {
            background-color: #3b49df; /* Color 3: Royal Slate Blue */
            color: #ffffff;
            border-color: #3b49df;
        }

        .panel-block {
            display: none;
        }

        .panel-block.visible {
            display: block;
        }

        /* Input Element Rows with SVGs */
        .field-row {
            margin-bottom: 20px;
        }

        .field-row label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper svg {
            position: absolute;
            left: 14px;
            width: 16px;
            height: 16px;
            fill: #64748b;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 12px 12px 42px;
            border: 1px solid #cbd5e1; /* Color 4: Input Boundary Gray */
            background-color: #ffffff;
            font-size: 14px;
            color: #1e293b;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: #3b49df;
        }

        /* Action Controls */
        .auth-submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #3b49df;
            border: none;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
        }

        .auth-submit-btn:hover {
            background-color: #2633c2;
        }

        .status-message {
            margin-bottom: 20px;
            padding: 10px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            display: none;
            background-color: #e0e7ff;
            border: 1px solid #a5b4fc;
            color: #3b49df;
        }
    </style>
</head>
<body>

    <!-- RIGHT SIDE: Input Form Canvas -->
    <div class="form-canvas">
        <h1 class="form-header-title">Form Login</h1>

        <!-- Segment Control Tabs -->
        <div class="control-tabs">
            <button class="tab-trigger active" id="loginTab" onclick="toggleInterface('login')">Login</button>
            <button class="tab-trigger" id="signupTab" onclick="toggleInterface('signup')">Register</button>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <!-- Login View Block -->
        <form id="loginBlock" class="panel-block visible" onsubmit="handleAuthAction(event, 'login')">
            <div class="field-row">
                <label for="loginUser">User Name</label>
                <div class="input-wrapper">
                    <!-- User Silhouette SVG -->
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <input type="text" id="loginUser" required placeholder="Username">
                </div>
            </div>
            <div class="field-row">
                <label for="loginPass">Password</label>
                <div class="input-wrapper">
                    <!-- Shield Lock SVG -->
                    <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                    <input type="password" id="loginPass" required placeholder="Password">
                </div>
            </div>
            <button type="submit" class="auth-submit-btn">Login</button>
        </form>

        <!-- Register View Block -->
        <form id="signupBlock" class="panel-block" onsubmit="handleAuthAction(event, 'signup')">
            <div class="field-row">
                <label for="regUser">User Name</label>
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <input type="text" id="regUser" required placeholder="Create Username">
                </div>
            </div>
            <div class="field-row">
                <label for="regEmail">Email Address</label>
                <div class="input-wrapper">
                    <!-- Envelope Mail SVG -->
                    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    <input type="email" id="regEmail" required placeholder="Email Address">
                </div>
            </div>
            <div class="field-row">
                <label for="regPass">Password</label>
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                    <input type="password" id="regPass" required minlength="6" placeholder="Password">
                </div>
            </div>
            <button type="submit" class="auth-submit-btn">Register</button>
        </form>

    </div>

    <script>
        function toggleInterface(targetMode) {
            const loginBlock = document.getElementById('loginBlock');
            const signupBlock = document.getElementById('signupBlock');
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const alertText = document.getElementById('statusMessage');

            alertText.style.display = 'none';

            if (targetMode === 'login') {
                loginBlock.classList.add('visible');
                signupBlock.classList.remove('visible');
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
            } else {
                loginBlock.classList.remove('visible');
                signupBlock.classList.add('visible');
                loginTab.classList.remove('active');
                signupTab.classList.add('active');
            }
        }

        function handleAuthAction(event, flow) {
            event.preventDefault();
            const alertText = document.getElementById('statusMessage');
            alertText.style.display = 'block';
            
            if (flow === 'login') {
                const user = document.getElementById('loginUser').value;
                alertText.innerText = `Welcome back! Logged in as: ${user}`;
            } else {
                const newUser = document.getElementById('regUser').value;
                alertText.innerText = `Success! Registered account: ${newUser}`;
            }
        }
    </script>
</body>
</html>
