<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashdark X - Enterprise Platform</title>
    <style>
        /* Fullscreen Layout Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            min-height: 100vh;
            display: flex;
        }

        /* 50/50 Full Width Split Container */
        .split-screen {
            display: flex;
            width: 100vw;
            min-height: 100vh;
        }

        /* Left Side: Massive Branding & Analytics Welcome Panel */
        .branding-side {
            flex: 1;
            background: linear-gradient(135deg, #131a2e 0%, #0b0f19 100%);
            border-right: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
        }

        .brand-logo-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .brand-circle {
            width: 24px;
            height: 24px;
            background-color: #c084fc;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(192, 132, 252, 0.6);
        }

        .brand-title-text {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .hero-title {
            font-size: 44px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero-title span {
            color: #c084fc;
        }

        .hero-subtitle {
            font-size: 16px;
            color: #64748b;
            line-height: 1.6;
            max-width: 500px;
        }

        /* Right Side: Interactive Authentication Panel */
        .form-side {
            flex: 1;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 440px;
        }

        /* Modern Navigation Control System */
        .tab-bar {
            display: flex;
            background-color: #131a2e;
            padding: 6px;
            margin-bottom: 40px;
            border: 1px solid #1e293b;
        }

        .tab-item {
            flex: 1;
            padding: 14px 0;
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .tab-item.active {
            background-color: #0b0f19;
            color: #c084fc;
            border: 1px solid #1e293b;
        }

        .panel-view {
            display: none;
        }

        .panel-view.active {
            display: block;
        }

        /* Form Inputs with SVG Icon Wrappers */
        .input-row {
            margin-bottom: 28px;
        }

        .input-row label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-container svg {
            position: absolute;
            left: 16px;
            width: 20px;
            height: 20px;
            fill: #64748b;
            transition: fill 0.2s ease;
        }

        .input-container input {
            width: 100%;
            padding: 16px 16px 16px 52px;
            border: 1px solid #1e293b;
            background-color: #131a2e;
            font-size: 15px;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-container input:focus {
            border-color: #c084fc;
        }

        .input-container input:focus + svg {
            fill: #c084fc;
        }

        /* Expansive Action Buttons */
        .submit-action {
            width: 100%;
            padding: 16px;
            border: none;
            background-color: #d946ef;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .submit-action:hover {
            background-color: #c026d3;
            box-shadow: 0 0 20px rgba(217, 70, 239, 0.4);
        }

        /* Notification Banner */
        .notice-banner {
            margin-bottom: 24px;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            display: none;
            background-color: rgba(192, 132, 252, 0.1);
            border: 1px solid #c084fc;
            color: #c084fc;
        }

        /* Responsive collapse for small window viewing widths */
        @media (max-width: 960px) {
            .split-screen { flex-direction: column; }
            .branding-side { padding: 40px; }
            .form-side { padding: 40px; }
        }
    </style>
</head>
<body>

    <div class="split-screen">
        
        <!-- Left Banner Grid Section -->
        <div class="branding-side">
            <div class="brand-logo-wrapper">
                <div class="brand-circle"></div>
                <div class="brand-title-text">Dashdark X</div>
            </div>
            <h1 class="hero-title">Measure your advertising <span>ROI</span> from one report.</h1>
            <p class="hero-subtitle">Access your centralized data workspace system. Monitor live website channels, clean tracking interfaces, and configure user goal pipelines seamlessly.</p>
        </div>

        <!-- Right System Input Section -->
        <div class="form-side">
            <div class="auth-wrapper">
                
                <!-- Modern Segmented Tabs -->
                <div class="tab-bar">
                    <button class="tab-item active" id="loginTab" onclick="changeViewState('login')">Log In</button>
                    <button class="tab-item" id="signupTab" onclick="changeViewState('signup')">Sign Up</button>
                </div>

                <div id="noticeBanner" class="notice-banner"></div>

                <!-- Log In Form Panel -->
                <form id="loginFormPanel" class="panel-view active" onsubmit="executeSubmit(event, 'login')">
                    <div class="input-row">
                        <label for="loginEmail">Email Address</label>
                        <div class="input-container">
                            <!-- Envelope Mail Icon -->
                            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                            <input type="email" id="loginEmail" required placeholder="john.carter@template.com">
                        </div>
                    </div>
                    <div class="input-row">
                        <label for="loginPassword">Password</label>
                        <div class="input-container">
                            <!-- Lock Icon -->
                            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                            <input type="password" id="loginPassword" required placeholder="••••••••">
                        </div>
                    </div>
                    <button type="submit" class="submit-action">Access Dashboard</button>
                </form>

                <!-- Sign Up Form Panel -->
                <form id="signupFormPanel" class="panel-view" onsubmit="executeSubmit(event, 'signup')">
                    <div class="input-row">
                        <label for="signupUser">Account Username</label>
                        <div class="input-container">
                            <!-- User Silhouette Icon -->
                            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                            <input type="text" id="signupUser" required placeholder="john_carter">
                        </div>
                    </div>
                    <div class="input-row">
                        <label for="signupEmail">Email Address</label>
                        <div class="input-container">
                            <!-- Envelope Mail Icon -->
                            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                            <input type="email" id="signupEmail" required placeholder="john.carter@template.com">
                        </div>
                    </div>
                    <div class="input-row">
                        <label for="signupPassword">Security Password</label>
                        <div class="input-container">
                            <!-- Lock Icon -->
