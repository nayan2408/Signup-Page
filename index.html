<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flat Design Authenticator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 35px 25px;
            border: 4px solid #34495e;
        }

        .brand-header {
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            color: #2c3e50;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab-navigation {
            display: flex;
            margin-bottom: 25px;
            border: 3px solid #bdc3c7;
        }

        .tab-toggle {
            flex: 1;
            padding: 12px;
            background-color: #ecf0f1;
            border: none;
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
            cursor: pointer;
            text-transform: uppercase;
        }

        .tab-toggle.active {
            background-color: #3498db;
            color: #ffffff;
        }

        .form-panel {
            display: none;
        }

        .form-panel.visible {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: bold;
            color: #34495e;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 3px solid #bdc3c7;
            background-color: #fafafa;
            font-size: 15px;
            color: #2c3e50;
            outline: none;
        }

        .form-group input:focus {
            border-color: #3498db;
            background-color: #ffffff;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
        }

        .login-btn-style { background-color: #2ecc71; }
        .login-btn-style:hover { background-color: #27ae60; }

        .signup-btn-style { background-color: #e67e22; }
        .signup-btn-style:hover { background-color: #d35400; }

        .notification-banner {
            margin-bottom: 20px;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            display: none;
            border: 3px solid #c3e6cb;
            background-color: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand-header">Welcome</div>

        <div class="tab-navigation">
            <button class="tab-toggle active" id="loginTabBtn" onclick="changePanel('login')">Log In</button>
            <button class="tab-toggle" id="signupTabBtn" onclick="changePanel('signup')">Sign Up</button>
        </div>

        <div id="noticeBox" class="notification-banner"></div>

        <form id="loginFormPanel" class="form-panel visible" onsubmit="triggerDemo(event, 'login')">
            <div class="form-group">
                <label for="userEmail">Email Address</label>
                <input type="email" id="userEmail" required placeholder="name@domain.com">
            </div>
            <div class="form-group">
                <label for="userPassword">Password</label>
                <input type="password" id="userPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="submit-btn login-btn-style">Access Account</button>
        </form>

        <form id="signupFormPanel" class="form-panel" onsubmit="triggerDemo(event, 'signup')">
            <div class="form-group">
                <label for="newName">Username</label>
                <input type="text" id="newName" required placeholder="username">
            </div>
            <div class="form-group">
                <label for="newEmail">Email Address</label>
                <input type="email" id="newEmail" required placeholder="name@domain.com">
            </div>
            <div class="form-group">
                <label for="newPassword">Password</label>
                <input type="password" id="newPassword" required minlength="6" placeholder="Min. 6 characters">
            </div>
            <button type="submit" class="submit-btn signup-btn-style">Register Now</button>
        </form>
    </div>

    <script>
        function changePanel(targetPanel) {
            const loginForm = document.getElementById('loginFormPanel');
            const signupForm = document.getElementById('signupFormPanel');
            const loginBtn = document.getElementById('loginTabBtn');
            const signupBtn = document.getElementById('signupTabBtn');
            const notice = document.getElementById('noticeBox');

            notice.style.display = 'none';

            if (targetPanel === 'login') {
                loginForm.classList.add('visible');
                signupForm.classList.remove('visible');
                loginBtn.classList.add('active');
                signupBtn.classList.remove('active');
            } else {
                loginForm.classList.remove('visible');
                signupForm.classList.add('visible');
                loginBtn.classList.remove('active');
                signupBtn.classList.add('active');
            }
        }

        function triggerDemo(e, formMode) {
            e.preventDefault();
            const notice = document.getElementById('noticeBox');
            notice.style.display = 'block';
            
            if (formMode === 'login') {
                const mail = document.getElementById('userEmail').value;
                notice.innerText = `Success! Logged in as: ${mail}`;
            } else {
                const user = document.getElementById('newName').value;
                notice.innerText = `Success! Registered user: ${user}`;
            }
        }
    </script>
</body>
</html>
