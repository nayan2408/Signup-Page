<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashdark X - Authenticate</title>
    <style>
        /* Cyber-Dark Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19; /* Color 1: Deep Dark Void */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        /* Premium Floating Dashboard Panel */
        .auth-card {
            background-color: #131a2e; /* Color 2: Cyber Slate */
            width: 100%;
            max-width: 420px;
            padding: 48px 36px;
            border: 1px solid #1e293b;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        /* Branding Elements from Dashboard */
        .brand-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .brand-icon {
            width: 16px;
            height: 16px;
            background-color: #c084fc;
            border-radius: 50%;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .header-title {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .header-subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 36px;
        }

        /* Segmented Controller System */
        .tab-menu {
            display: flex;
            background-color: #0b0f19;
            padding: 4px;
            margin-bottom: 32px;
            border: 1px solid #1e293b;
        }

        .tab-toggle {
            flex: 1;
            padding: 10px 0;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-toggle.active {
            background-color: #131a2e;
            color: #c084fc; /* Color 3: Neon Purple */
            border: 1px solid #1e293b;
        }

        /* Form Visibility Management */
        .form-view {
            display: none;
        }

        .form-view.visible {
            display: block;
        }

        /* Form Controls */
        .field-group {
            margin-bottom: 24px;
        }

        .field-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
        }

        .field-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #1e293b;
            background-color: #0b0f19;
            font-size: 15px;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }

        .field-group input:focus {
            border-color: #c084fc;
        }

        /* Glow Cyber Action Controls */
        .action-button {
            width: 100%;
            padding: 14px;
            border: none;
            background-color: #d946ef; /* Color 4: Cyber Pink */
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .action-button:hover {
            background-color: #c026d3;
            box-shadow: 0 0 15px rgba(217, 70, 239, 0.4);
        }

        /* Alert Window */
        .notice-container {
            margin-bottom: 24px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            display: none;
            background-color: rgba(192, 132, 252, 0.1);
            border: 1px solid #c084fc;
            color: #c084fc;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <!-- Logo Branding -->
        <div class="brand-wrapper">
            <div class="brand-icon"></div>
            <div class="brand-name">Dashdark X</div>
        </div>

        <div class="header-title">Welcome back, John</div>
        <div class="header-subtitle">Measure your advertising ROI from one report website traffic.</div>

        <!-- Navigation Tabs -->
        <div class="tab-menu">
            <button class="tab-toggle active" id="loginBtn" onclick="switchView('login')">Log In</button>
            <button class="tab-toggle" id="signupBtn" onclick="switchView('signup')">Sign Up</button>
        </div>

        <div id="noticeContainer" class="notice-container"></div>

        <!-- Login Form Panel -->
        <form id="loginForm" class="form-view visible" onsubmit="handleFormSubmit(event, 'login')">
            <div class="field-group">
                <label for="loginEmail">Email address</label>
                <input type="email" id="loginEmail" required placeholder="john.carter@template.com">
            </div>
            <div class="field-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="action-button">Create report</button>
        </form>

        <!-- Sign Up Form Panel -->
        <form id="signupForm" class="form-view" onsubmit="handleFormSubmit(event, 'signup')">
            <div class="field-group">
                <label for="signupUser">Username</label>
                <input type="text" id="signupUser" required placeholder="john_carter">
            </div>
            <div class="field-group">
                <label for="signupEmail">Email address</label>
                <input type="email" id="signupEmail" required placeholder="john.carter@template.com">
            </div>
            <div class="field-group">
                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" required minlength="6" placeholder="Minimum 6 characters">
            </div>
            <button type="submit" class="action-button">Initialize Account</button>
        </form>
    </div>

    <script>
        function switchView(target) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginBtn = document.getElementById('loginBtn');
            const signupBtn = document.getElementById('signupBtn');
            const notice = document.getElementById('noticeContainer');

            notice.style.display = 'none';

            if (target === 'login') {
                loginForm.classList.add('visible');
                signupForm.classList.remove('visible');
                loginBtn.classList.add('active');
                signupBtn.classList.remove('active');
            } else {
                loginForm.classList.remove('visible');
                signupForm.classList.add('visible');
                loginBtn.classList.remove('active');
                signupBtn.classList.add('active');
            }
        }

        function handleFormSubmit(e, type) {
            e.preventDefault();
            const notice = document.getElementById('noticeContainer');
            notice.style.display = 'block';
            
            if (type === 'login') {
                const email = document.getElementById('loginEmail').value;
                notice.innerText = `Dashboard loaded for session: ${email}`;
            } else {
                const user = document.getElementById('signupUser').value;
                notice.innerText = `Success! Account created for ${user}`;
            }
        }
    </script>
</body>
</html>
